# Databases for the integration tests, plus an optional demo. Nothing in the library
# needs any of this; the default `go test ./...` runs without a database and only the
# -tags=integration suite uses the containers below.
#
# Both engines at once, on non-default ports so they do not fight with a local install.
# Each suite skips when its own DSN is unset, so running one container is fine.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: grantz
      POSTGRES_PASSWORD: grantz
      POSTGRES_DB: grantz
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grantz"]
      interval: 2s
      timeout: 3s
      retries: 15

  # 8.0 rather than something newer: it is the version family the store documents as its
  # floor (the row-alias upsert needs 8.0.19), and testing the floor is what tells us the
  # claim is true. Anything later is a superset.
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: grantz
      MYSQL_USER: grantz
      MYSQL_PASSWORD: grantz
      MYSQL_DATABASE: grantz
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 5s
      retries: 30

  # The example HTTP server, for looking at the middleware without a Go toolchain:
  #
  #   docker compose --profile demo up demo
  #   curl -H 'X-User-Id: 1' localhost:8090/me/permissions
  #   curl -XPOST -H 'X-User-Id: 2' localhost:8090/invoices/1/cancel   # 403
  #
  # 8090 on the outside, like the databases: the example listens on 8080 and that port is
  # taken on most development machines.
  #
  # Behind a profile, so `docker compose up -d` still starts the databases and nothing
  # else. It needs no database of its own: the example carries an in-memory Store, which
  # is the point of keeping the database behind an interface.
  #
  # The source is mounted read-only and compiled on the spot rather than baked into an
  # image. There is no binary to ship here, and a Dockerfile for a library would be a
  # file that exists to look complete.
  demo:
    profiles: ["demo"]
    image: golang:1.24-alpine
    working_dir: /src
    volumes:
      - .:/src:ro
    command: go run ./examples/httpserver
    ports:
      - "8090:8080"
