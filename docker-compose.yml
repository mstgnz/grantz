# Postgres for the integration tests. Nothing in the library needs it; the default
# `go test ./...` runs without a database and only the -tags=integration suite uses this.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: grantz
      POSTGRES_PASSWORD: grantz
      POSTGRES_DB: grantz
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grantz"]
      interval: 2s
      timeout: 3s
      retries: 15
