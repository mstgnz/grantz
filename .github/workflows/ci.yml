name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # Every step below is a Makefile target, so what runs here is what a contributor
      # runs locally. Spelling the commands out in both places is how the two quietly
      # diverge and a green `make check` stops meaning a green pipeline.
      - name: Verify formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test and coverage
        run: make cover

      # The module must require nothing. This is not cosmetic: a require line here is
      # forced onto every consumer through minimal version selection, so a test-only
      # driver would silently upgrade the driver of a project that already used it.
      # That is why the integration suite lives in its own module.
      - name: No dependencies
        run: make deps-check

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grantz
          POSTGRES_PASSWORD: grantz
          POSTGRES_DB: grantz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grantz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

      # 8.0 is the floor the store documents (the row-alias upsert needs 8.0.19), and the
      # floor is the version worth testing: anything later is a superset.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: grantz
          MYSQL_USER: grantz
          MYSQL_PASSWORD: grantz
          MYSQL_DATABASE: grantz
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pgrantz --silent"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # Its own module, so the drivers it needs never reach the library's go.mod. Both
      # engines in one run: the suite is written once and asserts the same behaviour on
      # each, which is the only way a second dialect stays a dialect.
      #
      # Same make target a contributor runs, with the DSNs pointed at these services
      # rather than at the ports docker-compose uses.
      - name: Run the SQL suite against a real Postgres and a real MySQL
        run: |
          make test-integration \
            POSTGRES_DSN='postgres://grantz:grantz@localhost:5432/grantz?sslmode=disable' \
            MYSQL_DSN='grantz:grantz@tcp(127.0.0.1:3306)/grantz'
