name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

      # Nothing third-party may enter the library's own build. That is the pitch:
      # importing grantz adds nothing to a consumer's binary.
      #
      # Checked with `go list -deps` on the packages themselves rather than `go list -m
      # all`, because the module list includes the test-only Postgres driver, which the
      # integration suite needs and no consumer ever compiles.
      - name: No runtime dependencies
        run: |
          deps=$(go list -deps . ./sqlstore | grep -E '^[^/]+\.[^/]+/' | grep -v '^github.com/mstgnz/grantz' || true)
          if [ -n "$deps" ]; then
            echo "The library's build pulled in third-party packages:"
            echo "$deps"
            exit 1
          fi

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grantz
          POSTGRES_PASSWORD: grantz
          POSTGRES_DB: grantz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grantz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run the SQL suite against a real Postgres
        env:
          GRANTZ_TEST_DSN: postgres://grantz:grantz@localhost:5432/grantz?sslmode=disable
        run: go test -tags=integration ./sqlstore/
